server:
  port: 8094

eureka:
  client:
    service-url:
      defaultZone: http://servicio-eureka-server:8761/eureka

spring:
  datasource:
    url: jdbc:postgresql://postgres-gestor:5432/sgv_gestor
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        highlight_sql: true
        generate_statistics: true
  flyway:
    enabled: true
    locations: classpath:db/migration

vectorial-layer:
  status:
    withoutPresenting: SIN_PRESENTAR
    ommited: OMITIDA
    inRevision: EN_REVISION
    approved: APROBADO
    observed: OBSERVADO
    pending: PENDIENTE
    toModify: A_MODIFICAR

service-client:
  email:
    baseUri: http://localhost:8091
    emailUri: /api/emails/send

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG
    org.springframework.data.jpa: DEBUG
    ar.org.proyungas: DEBUG
