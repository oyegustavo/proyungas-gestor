server:
  port: 8091

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/gestor
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
    # hikari:
    #   maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

vectorial-layer:
  status:
    withoutPresenting: SIN_PRESENTAR
    ommited: OMITIDA
    inRevision: EN_REVISION
    approved: APROBADO
    observed: OBSERVADO
    pending: PENDIENTE
    toModify: A_MODIFICAR

service-client:
  email:
    baseUri: http://proyungas-email:8080
    emailUri: /api/emails/send